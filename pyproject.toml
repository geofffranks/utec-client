[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "utec-client"
description = "An independently maintained U-Tec/U-Home API client library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Luke Wallis", email = "wallis.luke4@gmail.com"},
]
maintainers = [
    {name = "Geoff Franks"},
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.7.4,<4.0.0",
]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["utec", "uhome", "home automation", "api client"]

[project.urls]
Homepage = "https://github.com/geofffranks/utec-client"
Issues = "https://github.com/geofffranks/utec-client/issues"

[project.optional-dependencies]
dev = [
    "aioresponses>=0.7.6",
    # aioresponses 0.7.9 is incompatible with aiohttp>=3.13 (ClientResponse
    # stream_writer kwarg); relax when aioresponses adds support.
    "aiohttp>=3.7.4,<3.13 ; extra == 'dev'",
    "build>=1.2",
    "coverage[toml]>=7.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools_scm]
# Release versions come from exact stable tags (vX.Y.Z). Anything else gets a
# development version and is never published by release automation.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-q --cov=utec_client --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["utec_client"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "def __repr__",
    "def __str__",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific
]

# Public enums deliberately subclass (str, Enum); StrEnum would change str() output
extend-ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["utec_client"]

[tool.ruff.lint.per-file-ignores]
# Manual developer scripts, not shipped or executed in CI: exempt from line length.
"scripts/*" = ["E501"]
