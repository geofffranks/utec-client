name: Weekly release

# Mondays 13:00 UTC. Selects the highest eligible fork release, verifies its
# tag is an ancestor of main, and — only when main has newer commits — cuts
# the next patch release at the pinned main commit, then dispatches the
# common validated publishing path (publish.yml), which builds and checks
# the exact tagged source. Skips with a notice when no fork baseline release
# exists yet or main is unchanged; never bootstraps from inherited upstream
# releases/tags.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: utec-client-release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.decide.outputs.action }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: decide
        run: |
          git remote set-branches origin main
          git fetch origin main
          DECISION=$(python scripts/prepare_release.py weekly)
          echo "$DECISION"
          ACTION=$(echo "$DECISION" | python -c "import json,sys; print(json.load(sys.stdin)['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          if [ "$ACTION" = release ]; then
            echo "tag=$(echo "$DECISION" | python -c "import json,sys; print(json.load(sys.stdin)['tag'])")" >> "$GITHUB_OUTPUT"
            echo "version=$(echo "$DECISION" | python -c "import json,sys; print(json.load(sys.stdin)['version'])")" >> "$GITHUB_OUTPUT"
          fi

  release:
    if: needs.decide.outputs.action == 'release'
    needs: decide
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and release
      actions: write # explicitly dispatch the publish workflow
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.decide.outputs.tag }}
      RELEASE_VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Re-validate version at the pinned main tip
        id: pin
        run: |
          git remote set-branches origin main
          git fetch origin main
          git checkout --detach origin/main
          OUT=$(python scripts/prepare_release.py manual "$RELEASE_VERSION")
          echo "$OUT"
          echo "sha=$(echo "$OUT" | python -c "import json,sys; print(json.load(sys.stdin)['sha'])")" >> "$GITHUB_OUTPUT"
      - name: Check tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::tag ${RELEASE_TAG} already exists; tags are never moved"
            exit 1
          fi
      - name: Create tag at the pinned main commit
        run: |
          git tag "${RELEASE_TAG}" "${{ steps.pin.outputs.sha }}"
          git push origin "refs/tags/${RELEASE_TAG}"
      - name: Generate release notes since the previous fork release
        run: python scripts/prepare_release.py notes --tag "${RELEASE_TAG}" > notes-body.md
      - name: Create the release with the fork marker
        run: |
          # The marker line identifies this as a fork release for weekly
          # selection; eligibility additionally requires fork-base ancestry.
          printf 'utec-client-fork-release: true\n\n' > release-body.md
          cat notes-body.md >> release-body.md
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "utec-client ${RELEASE_VERSION}" \
            --notes-file release-body.md
      - name: Dispatch the common validated publishing path
        run: |
          gh workflow run publish.yml \
            --ref main \
            -f tag="${RELEASE_TAG}" \
            -f version="${RELEASE_VERSION}"
