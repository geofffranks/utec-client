name: Tests

on:
  push:
    branches: [main]
  pull_request:

# PR checks are read-only and run no publishing credentials.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm derives the version from tags
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      # Coverage floor (90%) and flags are centralized in pyproject.toml.
      - run: pytest

  package:
    # Verify wheel/sdist metadata and installed-package behavior outside the
    # source checkout, including a wheel rebuilt from the sdist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e .[dev]
      - run: python -m build
      - name: Verify artifacts from a clean environment
        run: |
          V=$(basename dist/*.whl .whl); V=${V#utec_client-}; V=${V%-py3-none-any}
          python scripts/check_artifact.py --dist-dir dist --version "$V"
