name: Manual release

# Manual dispatch accepting a custom stable version (X.Y.Z / vX.Y.Z). Always
# validates from and releases at the tip of main (dispatching from another
# ref is rejected: the workflow checks out main and compares the pinned HEAD
# against the fetched origin/main tip). Can create the first fork release,
# permits intentional minor/major choices, and refuses reused, lower, or
# non-stable versions. After creating the tag and release it dispatches the
# common validated publishing path (publish.yml), which builds and checks
# the exact tagged source.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to release, e.g. 1.2.3 or v1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: utec-client-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and release
      actions: write # explicitly dispatch the publish workflow
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate requested version at the tip of main
        id: pin
        run: |
          git remote set-branches origin main
          git fetch origin main
          git checkout --detach origin/main
          OUT=$(python scripts/prepare_release.py manual "$REQUESTED_VERSION")
          echo "$OUT"
          echo "tag=$(echo "$OUT" | python -c "import json,sys; print(json.load(sys.stdin)['tag'])")" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$OUT" | python -c "import json,sys; print(json.load(sys.stdin)['version'])")" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$OUT" | python -c "import json,sys; print(json.load(sys.stdin)['sha'])")" >> "$GITHUB_OUTPUT"
      - name: Create tag at the pinned main commit
        env:
          RELEASE_TAG: ${{ steps.pin.outputs.tag }}
          PINNED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          git tag "${RELEASE_TAG}" "${PINNED_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"
      - name: Generate release notes since the previous fork release
        env:
          RELEASE_TAG: ${{ steps.pin.outputs.tag }}
        run: python scripts/prepare_release.py notes --tag "${RELEASE_TAG}" > notes-body.md
      - name: Create the release with the fork marker
        env:
          RELEASE_TAG: ${{ steps.pin.outputs.tag }}
          RELEASE_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          # The marker line identifies this as a fork release for weekly
          # selection; eligibility additionally requires fork-base ancestry.
          printf 'utec-client-fork-release: true\n\n' > release-body.md
          cat notes-body.md >> release-body.md
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --target "${{ steps.pin.outputs.sha }}" \
            --title "utec-client ${RELEASE_VERSION}" \
            --notes-file release-body.md
      - name: Dispatch the common validated publishing path
        env:
          RELEASE_TAG: ${{ steps.pin.outputs.tag }}
          RELEASE_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          gh workflow run publish.yml \
            --ref main \
            -f tag="${RELEASE_TAG}" \
            -f version="${RELEASE_VERSION}"
