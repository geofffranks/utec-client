name: Publish to PyPI

# Publishes the exact validated wheel+sdist retained as GitHub release assets
# BEFORE publication. The publish job never rebuilds: it downloads the
# release assets, verifies them against the attached SHA256SUMS manifest,
# classifies them against PyPI (read-only), uploads only missing files, then
# performs a post-upload readback verification against PyPI.
#
# Triggers:
# - workflow_dispatch/workflow_call with tag+version (release workflows and
#   safe retries after partial publication), and
# - human-created GitHub releases (which must carry the fork-release marker;
#   see docs/RELEASES.md).
#
# Security: inputs are only ever consumed through env vars (never raw shell
# interpolation); source eligibility is validated here from trusted main
# tooling BEFORE the release tag is checked out for anything.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose retained assets should be published"
        required: true
        type: string
      version:
        description: "Stable version matching the tag, e.g. 1.2.3"
        required: true
        type: string
  release:
    types: [published]

concurrency:
  group: utec-client-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-source:
    # Trusted-main validation, before any use of the target tag contents:
    # strict stable tag/version pair, single remote tag ref, tag commit an
    # ancestor of origin/main, release marked as a fork release, and the tag
    # commit a strict descendant of the fork base (inherited upstream tags
    # can never pass, marker or not).
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: set
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "version=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Validate source eligibility before any target-tag use
        env:
          PUBLISH_TAG: ${{ steps.set.outputs.tag }}
          PUBLISH_VERSION: ${{ steps.set.outputs.version }}
        run: |
          git remote set-branches origin main
          git fetch origin main
          python scripts/prepare_release.py prepublish --tag "$PUBLISH_TAG" --version "$PUBLISH_VERSION"

  pypi-publish:
    runs-on: ubuntu-latest
    needs: validate-source
    permissions:
      id-token: write # the only job with publishing authority (OIDC)
      contents: read
    environment:
      name: pypi-publish
      url: https://pypi.org/p/utec-client/
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_TAG: ${{ needs.validate-source.outputs.tag }}
      PUBLISH_VERSION: ${{ needs.validate-source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download retained release assets
        run: |
          mkdir -p dist
          gh release download "$PUBLISH_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          ls -la dist
      - name: Verify assets against the retained SHA256SUMS manifest
        run: python scripts/verify_assets.py --dir dist --manifest dist/SHA256SUMS
      - name: Read-only PyPI preflight (new / identical / conflict) and staging of new files
        id: preflight
        run: |
          set +e
          python scripts/pypi_preflight.py --dist-dir dist --staging-dir staging
          code=$?
          if [ "$code" = 0 ]; then echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 3 ]; then echo "proceed=false" >> "$GITHUB_OUTPUT"
          else exit 1; fi
      - name: Publish missing files to PyPI
        if: steps.preflight.outputs.proceed == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: staging/
      - name: Post-upload readback verification
        run: python scripts/pypi_preflight.py --dist-dir dist --verify-published
