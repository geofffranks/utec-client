name: Publish to PyPI

# Publishes validated wheel+sdist for an exact tag using PyPI Trusted
# Publishing (OIDC). Triggered explicitly by the weekly/manual release
# workflows (GITHUB_TOKEN release events do not trigger workflows), by
# workflow_dispatch for retries after partial publication, and by
# human-created GitHub releases.
#
# Inputs (workflow_dispatch / workflow_call):
#   tag     - the release tag, e.g. v1.2.3
#   version - the stable version, e.g. 1.2.3

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (must already exist)"
        required: true
        type: string
      version:
        description: "Stable version matching the tag, e.g. 1.2.3"
        required: true
        type: string
  release:
    types: [published]

concurrency:
  group: utec-client-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-build:
    # Runs the full check suite on the exact tagged source, then builds and
    # verifies the artifacts. Publishing is impossible if this job fails.
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Human-created release event: derive from the release.
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v5.3.0
        with:
          python-version: "3.13"
      - name: Validate version/tag pair
        run: python scripts/prepare_release.py verify --tag "${{ steps.resolve.outputs.tag }}" --version "${{ steps.resolve.outputs.version }}"
      - run: pip install -e .[dev]
      - run: ruff check . && ruff format --check .
      - run: pytest
      - run: python -m build
      - name: Verify artifact name/version/imports/license from a clean environment
        run: python scripts/check_artifact.py --dist-dir dist --version "${{ steps.resolve.outputs.version }}"
      - name: Confirm built artifact version matches the release version exactly
        run: |
          V=$(basename dist/*.whl .whl); V=${V#utec_client-}; V=${V%-py3-none-any}
          if [ "$V" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "::error::built version $V != release version ${{ steps.resolve.outputs.version }}"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  preflight:
    # Read-only PyPI check: distinguishes new files, files already published
    # with identical hashes (a previous retry succeeded), and conflicts.
    runs-on: ubuntu-latest
    needs: validate-and-build
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2
        with:
          ref: ${{ needs.validate-and-build.outputs.tag }}
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b # v5.3.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v4.6.0
        with:
          name: release-dists
          path: dist/
      - id: check
        run: |
          set +e
          python scripts/pypi_preflight.py --dist-dir dist
          code=$?
          if [ "$code" = 0 ]; then echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 3 ]; then echo "proceed=false" >> "$GITHUB_OUTPUT"
          else exit 1; fi

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [validate-and-build, preflight]
    if: needs.preflight.outputs.proceed == 'true'
    permissions:
      id-token: write # the only job with publishing authority (OIDC)
    environment:
      name: pypi-publish
      url: https://pypi.org/p/utec-client/
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v4.6.0
        with:
          name: release-dists
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
